<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>토익 시제부사 · 똑패스</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;">
      <h1 class="title" id="pageTitle" style="margin:0;">토익 시제부사</h1>
      <button type="button" id="btn-exit-quiz" class="btn-exit" style="display:none;" title="홈화면으로">나가기</button>
    </div>
    <p id="initStatus" style="margin:8px 0; color:#666; font-size:14px;">로딩 중…</p>
    <script>
      /* app.js(defer)보다 먼저 실행 — 구형 WebView에서 스크립트 실패해도 "로딩 중"만 뜨는 현상 완화 */
      (function () {
        try {
          var el = document.getElementById('initStatus');
          if (el) el.textContent = '불러오는 중…';
        } catch (e) {}
      })();
    </script>
    <p id="loadError" style="display:none; color:#c00; font-size:14px; margin-top:8px;"></p>
    <nav class="nav">
      <a href="#cards" class="nav-link active" data-view="cards">카드</a>
      <a href="#quiz" class="nav-link" data-view="quiz">퀴즈</a>
    </nav>
    <div id="jogbo-switch-bar" class="jogbo-switch-bar hidden" role="region" aria-label="다른 족보로 이동">
      <label for="jogbo-test-select-inner">다른 족보</label>
      <select id="jogbo-test-select-inner"></select>
      <button type="button" id="jogbo-test-go" class="btn-jogbo-go">이동</button>
    </div>
  </header>

  <main class="main">
    <!-- 카드 뷰 -->
    <section id="view-cards" class="view view-cards">
      <div class="filter">
        <label>시제</label>
        <select id="themeFilter">
          <option value="">전체</option>
          <option value="현재">현재</option>
          <option value="과거">과거</option>
          <option value="미래">미래</option>
          <option value="현재완료">현재완료</option>
        </select>
      </div>
      <div class="card-wrap">
        <div class="card" id="card">
          <div class="card-face card-front">
            <span class="card-theme-badge" id="cardThemeBadge">—</span>
            <div class="card-keyword-wrap">
              <p class="card-keyword" id="cardKeyword">—</p>
              <button type="button" class="btn-speak" id="btnCardSpeak" aria-label="발음 듣기" title="발음 듣기">🔊</button>
            </div>
            <p class="card-hint">탭하면 뒤집기</p>
          </div>
          <div class="card-face card-back">
            <p class="card-meaning" id="cardMeaning">—</p>
            <p class="card-example" id="cardExample">—</p>
            <p class="card-theme-line" id="cardThemeLine">—</p>
          </div>
        </div>
      </div>
      <div class="card-nav">
        <button type="button" class="btn btn-prev" id="cardPrev">이전</button>
        <span class="card-index" id="cardIndex">0 / 0</span>
        <button type="button" class="btn btn-next" id="cardNext">다음</button>
      </div>
    </section>

    <!-- 퀴즈 뷰 -->
    <section id="view-quiz" class="view view-quiz hidden">
      <div id="quiz-session-setup" class="quiz-session-setup">
        <h2 class="quiz-setup-title">학습 시작</h2>
        <p class="quiz-setup-desc">풀 문항 수를 선택한 뒤 시작하세요. 10문항씩 청크로 진행하며, 틀린 문제는 다 맞출 때까지 다시 나옵니다.</p>
        <div id="quizCumulativeWrongCard" class="quiz-cumulative-wrong-card hidden">
          <span class="quiz-cumulative-wrong-text" id="quizCumulativeWrongLine">📋 누적 오답: 0개</span>
          <button type="button" class="btn-quiz-manage-wrong" id="quizManageWrongBtn">관리하기</button>
        </div>
        <p class="quiz-setup-pool" id="quizSetupPoolLine">—</p>
        <div class="quiz-count-grid" id="quizCountGrid" role="group" aria-label="문항 수"></div>
        <button type="button" class="btn btn-quiz-start" id="quizSessionStart">학습 시작</button>
      </div>

      <div id="quiz-wrong-manage" class="quiz-wrong-manage hidden">
        <button type="button" class="btn-quiz-back-setup" id="quizWrongManageBack">← 학습 시작으로</button>
        <h2 class="quiz-setup-title" id="quizWrongManageTitle">누적 오답</h2>
        <div class="quiz-wrong-toolbar">
          <label class="quiz-wrong-select-all"><input type="checkbox" id="quizWrongSelectAll"> 전체 선택</label>
          <button type="button" class="btn-quiz-wrong-tool" id="quizWrongDismissSelected">선택 삭제</button>
          <button type="button" class="btn-quiz-wrong-tool primary" id="quizWrongRetrySelected">선택 다시 풀기</button>
        </div>
        <ul class="quiz-wrong-list" id="quizWrongList"></ul>
        <button type="button" class="btn btn-quiz-start" id="quizWrongRetryAll">모두 다시 풀기</button>
      </div>

      <div id="quiz-session-complete" class="quiz-session-complete hidden">
        <h2 class="quiz-setup-title">세션 완료</h2>
        <p id="quizCompleteSummary" class="quiz-complete-summary">—</p>
        <div class="quiz-complete-actions">
          <button type="button" class="btn btn-quiz-retry-wrong hidden" id="quizSessionRetryWrong">이번 세션 틀린 N개 다시 풀기</button>
          <button type="button" class="btn btn-quiz-finish" id="quizSessionFinish">끝내기</button>
        </div>
      </div>

      <div id="quiz-session-play" class="quiz-session-play hidden">
      <p class="quiz-chunk-banner hidden" id="quizChunkRetryBanner" role="status"></p>
      <p class="quiz-progress-line" id="quizProgressLine" style="margin-bottom:12px; font-size:15px; font-weight:600; color:#4b5563;">0 / 0 문제</p>
      <div id="quiz-dimension-row" class="quiz-dimension-row hidden" role="group" aria-label="출제 방식">
        <span class="quiz-dimension-label">매칭</span>
        <label class="quiz-dim-opt"><input type="radio" name="quizDim" value="pos" checked> 품사</label>
        <label class="quiz-dim-opt"><input type="radio" name="quizDim" value="meaning"> 뜻</label>
      </div>
      <p class="quiz-question" id="quizQuestion">이 부사는 어느 시제에 쓰이나요?</p>
      <div class="quiz-word-row">
        <p class="quiz-word" id="quizWord">—</p>
        <button type="button" class="btn-speak" id="btnQuizSpeak" aria-label="발음 듣기" title="발음 듣기">🔊</button>
      </div>
      <p class="quiz-meaning" id="quizMeaning" style="margin:10px 0 14px; font-size:15px; line-height:1.45; color:#374151;">—</p>
      <ul class="quiz-choices" id="quizChoices"></ul>
      <div class="quiz-feedback hidden" id="quizFeedback"></div>
      <div class="quiz-nav">
        <span class="quiz-score" id="quizScore">0 / 0</span>
        <button type="button" class="btn btn-next-quiz hidden" id="quizNext" aria-hidden="true" tabindex="-1">다음</button>
      </div>
      <p id="jogboAppScoreLine" class="jogbo-app-score-line hidden" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <div id="quiz-answer-modal" class="quiz-answer-modal hidden" role="dialog" aria-modal="true" aria-labelledby="quizModalVerdict">
    <div class="quiz-answer-modal-backdrop" aria-hidden="true"></div>
    <div class="quiz-answer-modal-sheet">
      <p id="quizModalVerdict" class="quiz-modal-verdict"></p>
      <p id="quizModalKeyword" class="quiz-modal-keyword"></p>
      <p id="quizModalMeaning" class="quiz-modal-meaning"></p>
      <p id="quizModalExtra" class="quiz-modal-extra"></p>
      <button type="button" id="quizModalNext" class="btn btn-quiz-start quiz-modal-next">다음</button>
    </div>
  </div>

  <script src="config.js?v=6" defer></script>
  <script src="app.js?v=39" defer onerror="(function(){var e=document.getElementById('loadError'),i=document.getElementById('initStatus');if(e){e.style.display='block';e.innerHTML='app.js를 불러오지 못했습니다. 비행기모드·차단 해제 후 <strong>캐시 삭제</strong>하고 새로고침하세요.';}if(i){i.style.display='none';}})()"></script>
  <script>
    /** 여전히 "로딩 중"(인라인 스크립트까지 실행 안 됨)일 때만 — 대부분 HTML 캐시 꼬임 */
    setTimeout(function() {
      var s = document.getElementById('initStatus');
      if (!s || s.style.display === 'none') return;
      if (s.textContent.indexOf('로딩 중') >= 0 || s.textContent.indexOf('불러오는') >= 0) {
        s.innerHTML = '페이지가 오래된 캐시일 수 있습니다. <strong>캐시 삭제</strong> 후 다시 열어 주세요.';
        s.style.color = '#c00';
      }
    }, 25000);
  </script>
</body>
</html>
